<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Pratibha — Manage Updates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1A4FA0" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app">

  <div class="topbar">
    <button class="back-btn" onclick="window.location.href='teacher-home.html'">‹</button>
    <div style="text-align:center; flex:1;">
      <div class="topbar-title">Updates</div>
      <div class="topbar-sub">Post announcements for students</div>
    </div>
    <div style="width:34px;"></div>
  </div>

  <div class="content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin:6px 4px 12px;">
      <div class="section-label" style="margin:0;">All Updates</div>
      <button class="btn-primary" id="toggleAddUpdateBtn" style="width:auto; padding:8px 14px; font-size:13px; margin:0;">+ New Update</button>
    </div>

    <div id="addUpdatePanel" style="display:none; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; margin-bottom:16px; box-shadow:var(--shadow-card);">
      <div class="form-error" id="updateFormError"></div>
      <form id="addUpdateForm">
        <div class="field">
          <label for="updateTitle">Title</label>
          <input type="text" id="updateTitle" placeholder="e.g. New Bengali lesson uploaded" required />
        </div>
        <div class="field">
          <label for="updateMessage">Message</label>
          <input type="text" id="updateMessage" placeholder="What do students need to know?" required />
        </div>
        <div class="field" style="display:flex; align-items:center; gap:8px;">
          <input type="checkbox" id="sendNotifyCheckbox" checked style="width:auto; margin:0;" />
          <label for="sendNotifyCheckbox" style="margin:0; font-size:13px; color:var(--ink); font-weight:500;">🔔 Also send push notification to students</label>
        </div>
        <button type="submit" class="btn-primary" id="addUpdateSubmit">Post Update</button>
      </form>
    </div>

    <div id="updatesList">
      <div class="loading-row">Loading updates…</div>
    </div>
  </div>

</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
<script type="module" src="js/teacher-updates.js"></script>
</body>
</html>
