<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Pratibha — Teacher Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
   <link rel="manifest" href="manifest.json" />
   <meta name="theme-color" content="#1A4FA0" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app">

  <div class="topbar">
    <div class="brand"><span class="spark">✦</span> PRATIBHA</div>
    <div class="topbar-actions">
      <span style="font-size:12px; opacity:0.85;">Teacher</span>
      <button class="avatar-btn" id="avatarBtn">T</button>
    </div>
  </div>

  <div class="content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin:6px 4px 12px;">
      <div class="section-label" style="margin:0;">Subjects</div>
      <button class="btn-primary" id="toggleAddSubjectBtn" style="width:auto; padding:8px 14px; font-size:13px; margin:0;">+ Add Subject</button>
    </div>

    <div id="addSubjectPanel" style="display:none; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; margin-bottom:16px; box-shadow:var(--shadow-card);">
      <div class="form-error" id="subjectFormError"></div>
      <form id="addSubjectForm">
        <div class="field">
          <label for="subjectName">Subject name</label>
          <input type="text" id="subjectName" placeholder="e.g. Mathematics" required />
        </div>
        <div class="field">
          <label for="subjectDesc">Short description</label>
          <input type="text" id="subjectDesc" placeholder="e.g. Mathematics lessons and classes" />
        </div>
        <div class="field">
          <label for="subjectIcon">Icon letter (1 letter)</label>
          <input type="text" id="subjectIcon" placeholder="e.g. M" maxlength="2" />
        </div>
        <button type="submit" class="btn-primary" id="addSubjectSubmit">Add Subject</button>
      </form>
    </div>

    <div class="card-list" id="subjectList">
      <div class="loading-row">Loading subjects…</div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active">
      <span class="icon">🏠</span> Dashboard
    </button>
    <button class="nav-item" id="logoutBtn">
      <span class="icon">↪</span> Logout
    </button>
  </div>

</div>

<script type="module" src="js/teacher-home.js"></script>
   <script>
     if ('serviceWorker' in navigator) {
       navigator.serviceWorker.register('/sw.js');
     }
   </script>
</body>
</html>
